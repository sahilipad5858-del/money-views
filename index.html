<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoneyViews — YouTube Shorts Viewer</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --card: #16161f;
    --border: #262633;
    --text: #f4f4f8;
    --muted: #9b9bb0;
    --accent: #ff4e45;
    --accent2: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, rgba(255,78,69,.12), transparent 60%),
                radial-gradient(900px 500px at -10% 10%, rgba(255,138,61,.10), transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { text-align: center; padding: 40px 16px 6px; }
  h1 { font-size: clamp(30px, 5vw, 46px); margin: 0 0 6px; background: linear-gradient(90deg, #ff4e45, #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { color: var(--muted); margin: 0; font-size: 14px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }
  .controls { display: flex; gap: 12px; justify-content: center; margin: 28px 0 8px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1; min-width: 260px; max-width: 560px; padding: 14px 18px; font-size: 16px;
    border-radius: 14px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 14px 22px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 20px rgba(255,78,69,.35);
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255,78,69,.45); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .status { min-height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; padding: 10px; }
  .status.error { color: #ff7b72; }
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px 0 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .2s, border-color .2s; }
  .card:hover { transform: translateY(-5px); border-color: #3a3a4d; }
  .thumb { position: relative; aspect-ratio: 9 / 16; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .duration { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0); transition: background .2s; }
  .card:hover .play-overlay { background: rgba(0,0,0,.35); }
  .play-circle { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,78,69,.95); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px rgba(255,78,69,.5); }
  .play-circle::after { content: ''; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 3px; }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 20px; font-size: 16px; }
  .loadmore-wrap { text-align: center; padding: 10px 0 60px; }
  .loadmore-wrap button { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; padding: 12px 26px; font-size: 15px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { position: relative; width: min(92vw, 400px); aspect-ratio: 9 / 16; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
  .modal iframe { width: 100%; height: 100%; border: 0; background: #000; display: block; }
  .modal-close { position: absolute; top: 10px; right: 10px; z-index: 20; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(0,0,0,.7); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(0,0,0,.7); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover { background: rgba(255,78,69,.85); }
  .nav-btn.prev { left: 10px; } .nav-btn.next { right: 10px; }
  .modal-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; z-index: 20; }
  .modal-info .t { font-size: 14px; font-weight: 600; }
  .modal-info .m { font-size: 12px; color: #ccc; margin-top: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
  <header>
    <h1>MoneyViews</h1>
    <p class="subtitle">Random YouTube Shorts Viewer — 24 at a time from any channel</p>
  </header>
  <main class="container">
    <div class="controls">
      <input id="channelInput" type="text" placeholder="Enter YouTube channel — e.g. @MrBeast or https://youtube.com/@MrBeast" spellcheck="false" />
      <button id="loadBtn">Load 24 Random Shorts</button>
    </div>
    <div id="status" class="status"><span class="spinner"></span></div>
    <div id="grid" class="grid"></div>
    <div id="loadMoreWrap" class="loadmore-wrap" style="display:none;">
      <button id="loadMoreBtn">Load More</button>
    </div>
  </main>
  <footer>Built with the YouTube RSS feed + YouTube embeds • Videos belong to their respective owners</footer>

  <div class="modal-overlay" id="modal">
    <button class="modal-close" id="modalClose">&#10005;</button>
    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <div class="modal">
      <iframe id="player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <button class="nav-btn next" id="nextBtn">&#10095;</button>
    <div class="modal-info">
      <div class="t" id="modalTitle"></div>
      <div class="m" id="modalMeta"></div>
    </div>
  </div>

<script>
  const BATCH = 24;
  const SHORTS_COUNT = 24;

  const state = { shorts: [], visible: 0, currentIndex: -1 };

  const $ = (id) => document.getElementById(id);

  function showStatus(msg, isError = false) {
    const el = $('status');
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : '');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const PROXIES = [
    (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    (u) => `https://api.cors.lol/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];

  async function fetchViaProxy(targetUrl) {
    let lastErr = null;
    for (const p of PROXIES) {
      try {
        const res = await fetch(p(targetUrl), { headers: { Accept: 'application/xml, application/json, text/plain, */*' } });
        if (res.ok) {
          const text = await res.text();
          if (text && text.trim().length > 20) return text;
        }
      } catch (e) { lastErr = e; }
    }
    throw new Error('Network error while fetching from YouTube');
  }

  async function resolveChannelId(input) {
    let value = input.trim();
    const direct = value.match(/channel\/(UC[A-Za-z0-9_-]{22})/);
    if (direct) return direct[1];
    let handle = value.replace(/^@/, '').split(/[?&#]/)[0].replace(/\/+$/, '');
    if (!/^[A-Za-z0-9_]{1,50}$/.test(handle)) throw new Error('Invalid YouTube channel URL or @handle');
    const text = await fetchViaProxy(`https://www.youtube.com/@${handle}`);
    const m = text.match(/"channelId":"(UC[A-Za-z0-9_-]{22})"/);
    if (!m) throw new Error('Could not resolve channel ID. Try a different handle.');
    return m[1];
  }

  function parseShortsXml(xmlText) {
    const shorts = [];
    const entries = xmlText.split(/<entry[\s\S]*?<\/entry>/).slice(1);
    for (const entry of entries) {
      const vidM = entry.match(/yt:videoId>([^<]+)</);
      const titleM = entry.match(/<title>([^<]*)<\/title>/);
      const thumbM = entry.match(/media:thumbnail url="([^"]+)"/);
      const viewsM = entry.match(/media:statistics views="([^"]+)"/);
      const isShort = /youtube\.com\/shorts\//.test(entry);
      const videoId = vidM ? vidM[1] : null;
      if (!videoId || !isShort) continue;
      shorts.push({
        videoId,
        title: titleM ? titleM[1] : 'Untitled Short',
        thumbnail: thumbM ? thumbM[1] : `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
        viewsText: viewsM ? viewsM[1] : '—'
      });
    }
    return shorts;
  }

  async function fetchShortsFromChannel(channelId) {
    const xmlText = await fetchViaProxy(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
    return parseShortsXml(xmlText);
  }

  function cardHTML(v, i) {
    return `
      <div class="card" data-video-id="${v.videoId}" data-index="${i}">
        <div class="thumb">
          <img src="${v.thumbnail}" alt="${escapeHtml(v.title)}" loading="lazy" />
          <div class="play-overlay"><div class="play-circle"></div></div>
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(v.title)}</div>
          <div class="card-meta">${escapeHtml(v.viewsText)} views</div>
        </div>
      </div>`;
  }

  function renderGrid() {
    const grid = $('grid');
    const shorts = state.shorts.slice(0, state.visible);
    if (!shorts.length) {
      grid.innerHTML = `<div class="empty">No shorts found for this channel. Try another channel.</div>`;
      return;
    }
    grid.innerHTML = shorts.map((v, i) => cardHTML(v, i)).join('');
    document.getElementById('loadMoreWrap').style.display = state.visible < state.shorts.length ? 'block' : 'none';
  }

  async function loadShorts() {
    const input = $('channelInput').value.trim();
    if (!input) { showStatus('Please enter a YouTube channel.', true); return; }
    showStatus('Fetching shorts from YouTube…');
    $('loadBtn').disabled = true;
    try {
      const channelId = await resolveChannelId(input);
      const shorts = await fetchShortsFromChannel(channelId);
      if (!shorts.length) { showStatus('No shorts found for this channel.', true); return; }
      state.shorts = shuffle(shorts);
      state.visible = Math.min(SHORTS_COUNT, state.shorts.length);
      renderGrid();
      showStatus(`${shorts.length} shorts found from the channel — showing ${state.visible} randomly picked.`);
    } catch (e) {
      showStatus('Error: ' + (e.message || 'Failed to fetch shorts'), true);
    } finally {
      $('loadBtn').disabled = false;
    }
  }

  function openPlayer(videoId) {
    const shorts = state.shorts.slice(0, state.visible);
    const idx = shorts.findIndex(v => v.videoId === videoId);
    if (idx === -1) return;
    state.currentIndex = idx;
    $('player').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
    $('modalTitle').textContent = shorts[idx].title;
    $('modalMeta').textContent = `${shorts[idx].viewsText} views`;
    $('modal').classList.add('open');
  }

  function closePlayer() {
    $('modal').classList.remove('open');
    $('player').src = '';
    state.currentIndex = -1;
  }

  function stepPlayer(delta) {
    const shorts = state.shorts.slice(0, state.visible);
    if (!shorts.length) return;
    state.currentIndex = Math.min(Math.max(state.currentIndex + delta, 0), shorts.length - 1);
    const v = shorts[state.currentIndex];
    $('player').src = `https://www.youtube.com/embed/${v.videoId}?autoplay=1&rel=0&modestbranding=1`;
    $('modalTitle').textContent = v.title;
    $('modalMeta').textContent = `${v.viewsText} views`;
  }

  document.getElementById('grid').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    openPlayer(card.dataset.videoId);
  });

  $('modalClose').addEventListener('click', closePlayer);
  $('prevBtn').addEventListener('click', () => stepPlayer(-1));
  $('nextBtn').addEventListener('click', () => stepPlayer(1));
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closePlayer(); });

  document.addEventListener('keydown', (e) => {
    if (!$('modal').classList.contains('open')) return;
    if (e.key === 'Escape') closePlayer();
    if (e.key === 'ArrowRight') stepPlayer(1);
    if (e.key === 'ArrowLeft') stepPlayer(-1);
  });

  $('loadBtn').addEventListener('click', loadShorts);
  $('channelInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadShorts(); });
  $('loadMoreBtn').addEventListener('click', () => { state.visible += BATCH; renderGrid(); });

  renderGrid();
</script>
</body>
</html>
